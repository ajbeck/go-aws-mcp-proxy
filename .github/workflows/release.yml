name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag whose assets should be rebuilt and uploaded"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Set up Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run CI
        run: go run ./cmd/scripts ci

  release:
    name: Prepare Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release-context.outputs.tag }}
      version: ${{ steps.release-context.outputs.version }}
    steps:
      - name: Create release automation token
        id: release-token
        if: ${{ vars.RELEASE_PLEASE_CLIENT_ID != '' }}
        # https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update release pull request or GitHub release
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        # https://github.com/googleapis/release-please-action/releases/tag/v5.0.0
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.release-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Configure release asset packaging
        id: release-context
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.release_tag != '' }}
        env:
          AUTOMATED_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          AUTOMATED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="${MANUAL_RELEASE_TAG:-$AUTOMATED_RELEASE_TAG}"
          release_version="${AUTOMATED_RELEASE_VERSION:-${release_tag#v}}"

          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null

          {
            echo "tag=$release_tag"
            echo "version=$release_version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - name: Checkout release tag
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release asset
        id: build
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          asset_base="aws-mcp-proxy-${{ matrix.goos }}-${{ matrix.goarch }}"
          binary="aws-mcp-proxy"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          mkdir -p "bin/${asset_base}"
          go run ./cmd/scripts/main.go build \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --version "${VERSION}" \
            --output "bin/${asset_base}/${binary}"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd bin && zip -r "${asset_base}.zip" "${asset_base}")
            asset="${asset_base}.zip"
          else
            tar -C bin -czf "bin/${asset_base}.tar.gz" "${asset_base}"
            asset="${asset_base}.tar.gz"
          fi

          (cd bin && sha256sum "${asset}" > "${asset}.sha256")
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "contents=bin/${asset_base}" >> "${GITHUB_OUTPUT}"

      - name: Generate SPDX SBOM
        # https://github.com/anchore/sbom-action/releases/tag/v0.24.2
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: ${{ steps.build.outputs.contents }}
          format: spdx-json
          output-file: bin/${{ steps.build.outputs.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        # https://github.com/actions/attest/releases/tag/v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: bin/${{ steps.build.outputs.asset }}

      - name: Attest SPDX SBOM
        # https://github.com/actions/attest/releases/tag/v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: bin/${{ steps.build.outputs.asset }}
          sbom-path: bin/${{ steps.build.outputs.asset }}.spdx.json

      - name: Upload packaged binary
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.asset }}
          path: |
            bin/${{ steps.build.outputs.asset }}
            bin/${{ steps.build.outputs.asset }}.sha256
            bin/${{ steps.build.outputs.asset }}.spdx.json
          if-no-files-found: error

  publish:
    name: Upload Release Assets
    needs:
      - release
      - build
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
